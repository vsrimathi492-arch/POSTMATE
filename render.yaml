services:
  - type: web
    name: postmate-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: USE_LOCAL_DB_FALLBACK
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
